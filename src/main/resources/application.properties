spring.application.name=POS

server.port=8093

spring.datasource.url=jdbc:mysql://localhost:3306/POS_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
